<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap & Fit AI</title>
    <style>
        :root { --bg: #060913; --card-bg: rgba(18, 24, 40, 0.9); --card-border: rgba(255, 255, 255, 0.12); --primary: #00ff88; --accent: #00d4ff; --text: #f8fafc; --gradient-btn: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 20px; margin-bottom: 16px; backdrop-filter: blur(10px); }
        h2 { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 14px; }
        input, select { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(8, 12, 22, 0.7); color: #fff; margin-bottom: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border-radius: 16px; border: none; background: var(--gradient-btn); color: #060913; font-weight: 800; cursor: pointer; margin-top: 8px; font-size: 14px; }
        .screen-view { display: none; }
        .screen-view.active { display: block; }
        .exercise-card { background: rgba(8, 12, 22, 0.7); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .stat-box { background: rgba(8, 12, 22, 0.7); border: 1px solid var(--card-border); padding: 12px; border-radius: 14px; text-align: center; }
        .stat-box b { color: var(--primary); font-size: 16px; display: block; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- ЭКРАН 1: АНКЕТА -->
    <div id="screen-profile" class="screen-view active">
        <div class="card">
            <h2>🤖 Настройка параметров</h2>
            <select id="gender"><option>Мужчина</option><option>Женщина</option></select>
            <input type="number" id="weight" value="70">
            <button class="btn" onclick="generateAIProgram()">⚡ Рассчитать план</button>
        </div>
    </div>

    <!-- ЭКРАН 2: МЕНЮ -->
    <div id="screen-main" class="screen-view">
        <div class="card">
            <h2>🏋️‍♂️ Ваша программа</h2>
            <div id="monthsList"></div>
            <button class="btn" onclick="switchScreen('screen-water')">💧 Трекер воды</button>
        </div>
    </div>

    <!-- ЭКРАН 3: ТРЕНИРОВКА (Интерактив) -->
    <div id="screen-workout" class="screen-view">
        <div class="card">
            <h2 id="exName">Упражнение</h2>
            <div id="videoContainer" style="background:#000; height:200px; margin-bottom:15px; border-radius:12px; overflow:hidden;">
                <iframe id="exVideo" width="100%" height="100%" src="" frameborder="0"></iframe>
            </div>
            <div class="stats-grid">
                <div class="stat-box">Подход<b id="currentSet">1 / 4</b></div>
                <div class="stat-box">Повторы<b id="repsCount">10</b></div>
            </div>
            <div id="timerDisplay" style="display:none; text-align:center; font-size:40px; color:var(--primary); font-weight:bold;">
                Отдых: <span id="sec">60</span>с
            </div>
            <button id="btnAction" class="btn" onclick="nextStep()">✅ Выполнено</button>
            <button class="btn" style="background: rgba(255,255,255,0.1); color:#fff;" onclick="switchScreen('screen-main')">❌ Выход</button>
        </div>
    </div>

    <!-- ЭКРАН 4: ВОДА -->
    <div id="screen-water" class="screen-view">
        <div class="card">
            <h2>💧 Вода</h2>
            <button class="btn" onclick="switchScreen('screen-main')">⬅ Назад</button>
        </div>
    </div>
</div>

<script>
    let workout = { exercises: [], currentEx: 0, currentSet: 1 };

    function switchScreen(id) {
        document.querySelectorAll('.screen-view').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function generateAIProgram() {
        document.getElementById('monthsList').innerHTML = `<button class="btn" onclick="startWorkout()">Месяц 1: Начать тренировку</button>`;
        switchScreen('screen-main');
    }

    function startWorkout() {
        // Здесь можно подтягивать любые упражнения
        workout.exercises = [
            {name: "Приседания", sets: 3, reps: 10, video: "https://www.youtube.com/embed/bXvN0Vv0W4U"},
            {name: "Отжимания", sets: 3, reps: 12, video: "https://www.youtube.com/embed/IODxDxX7oi4"}
        ];
        workout.currentEx = 0;
        workout.currentSet = 1;
        updateWorkoutUI();
        switchScreen('screen-workout');
    }

    function updateWorkoutUI() {
        let ex = workout.exercises[workout.currentEx];
        document.getElementById('exName').innerText = ex.name;
        document.getElementById('exVideo').src = ex.video;
        document.getElementById('currentSet').innerText = `${workout.currentSet} / ${ex.sets}`;
        document.getElementById('repsCount').innerText = ex.reps;
    }

    function nextStep() {
        if (workout.currentSet < workout.exercises[workout.currentEx].sets) {
            startRest();
        } else if (workout.currentEx < workout.exercises.length - 1) {
            workout.currentEx++;
            workout.currentSet = 1;
            updateWorkoutUI();
        } else { alert("Тренировка завершена!"); switchScreen('screen-main'); }
    }

    function startRest() {
        document.getElementById('timerDisplay').style.display = 'block';
        document.getElementById('btnAction').style.display = 'none';
        let s = 60;
        let t = setInterval(() => {
            s--;
            document.getElementById('sec').innerText = s;
            if(s <= 0) {
                clearInterval(t);
                workout.currentSet++;
                updateWorkoutUI();
                document.getElementById('timerDisplay').style.display = 'none';
                document.getElementById('btnAction').style.display = 'block';
            }
        }, 1000);
    }
</script>
</body>
</html>
