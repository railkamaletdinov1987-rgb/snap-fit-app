<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap & Fit AI</title>
    <style>
        body { font-family: sans-serif; background: #060913; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 450px; }
        .card { background: #121828; padding: 20px; border-radius: 20px; border: 1px solid #333; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; background: #080c16; color: #fff; border: 1px solid #444; }
        button { width: 100%; padding: 14px; margin-top: 10px; border-radius: 14px; border: none; background: linear-gradient(135deg, #00ff88, #00d4ff); font-weight: bold; cursor: pointer; }
        #aiOutput { margin-top: 20px; white-space: pre-wrap; font-size: 13px; color: #ccc; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card">
        <h2>Настройка плана</h2>
        <input type="number" id="age" placeholder="Возраст">
        <input type="number" id="height" placeholder="Рост (см)">
        <input type="number" id="weight" placeholder="Вес (кг)">
        <button onclick="sendData()">Отправить данные</button>
        <div id="aiOutput"></div>
    </div>
</div>

<script>
    // Тот самый адрес, который уже подтвердил работу через /test
    const SERVER_URL = 'https://snap-fit-backend.onrender.com/api/analyze';

    async function sendData() {
        const out = document.getElementById('aiOutput');
        const data = {
            gender: 'Мужчина',
            age: document.getElementById('age').value,
            height: document.getElementById('height').value,
            weight: document.getElementById('weight').value,
            goal: 'Постройнеть',
            location: 'Дома',
            durationMonths: 3
        };

        out.innerText = "Отправляю на " + SERVER_URL + "...";

        try {
            const response = await fetch(SERVER_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            console.log("Status:", response.status);

            if (response.status === 404) {
                out.innerText = "Ошибка 404: Сервер не нашел путь /api/analyze. Убедитесь, что код на GitHub обновлен.";
            } else if (!response.ok) {
                out.innerText = "Ошибка " + response.status;
            } else {
                const json = await response.json();
                out.innerText = "Успех! " + JSON.stringify(json.text);
            }
        } catch (e) {
            out.innerText = "Ошибка сети: " + e.message;
        }
    }
</script>
</body>
</html>
